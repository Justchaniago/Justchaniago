<!DOCTYPE html>
<html>
<head>
    <title>Login Admin</title>
    <style>
        /* RESET KURSOR AGAR BISA KLIK */
        * { cursor: auto !important; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7; /* Abu-abu Apple */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; 
        }
        h2 { margin-bottom: 20px; color: #1d1d1f; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #d2d2d7; 
            border-radius: 10px; 
            box-sizing: border-box; /* Penting agar padding gak bikin lebar */
            font-size: 16px;
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px;
            background-color: #0071e3; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #0077ed; }
        
        a { color: #86868b; text-decoration: none; font-size: 14px; }
        a:hover { color: #0071e3; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Login Chaniago</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p style="color: #ff3b30; font-size: 14px; margin-bottom: 15px;">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Masuk Dashboard</button>
        </form>
        
        <p style="margin-top: 20px;">
            <a href="/">← Kembali ke Portfolio</a>
        </p>
    </div>
</body>
</html>
