<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Chaniago</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}?v=2">
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-light light-1"></div>
        <div class="aurora-light light-2"></div>
        <div class="aurora-light light-3"></div>
        <div class="aurora-overlay"></div>
    </div>

    <div class="auth-container fade-in">
        <div class="glass-box auth-box">
            <h2 class="auth-title">Welcome Back.</h2>
            <p class="auth-subtitle">Please enter your credentials.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="auth-form">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="admin" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary btn-full magnetic-btn">Access Dashboard →</button>
            </form>

            <div class="auth-footer">
                <a href="/">← Back to Portfolio</a>
            </div>
        </div>
    </div>
    
    <div class="cursor-glow"></div>
    <script>
        const cursor = document.querySelector('.cursor-glow');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
